<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Doctor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌾 Crop Doctor</h1>

        <p>AI-powered crop health assistant</p>

        <h2>Upload a photo of your crop</h2>

        <input type="file" id="cropImage" accept="image/*">

        <br><br>
        <img id="imagePreview" src="" alt="Crop Preview">

        <button id="diagnoseButton">🔍 Diagnose Crop</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
